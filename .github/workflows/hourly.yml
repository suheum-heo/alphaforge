name: Hourly forecasts and Pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'models/hourly-v1/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/hourly.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  forecast:
    if: github.repository == 'suheum-heo/alphaforge'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Restore permanent forecast ledger
        uses: actions/checkout@v4
        with:
          ref: forecast-history
          path: forecast-history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[deep]'
      - name: Record prospective forecasts
        run: python -m alphaforge.live --ledger forecast-history/state.json --phase record
      - name: Persist forecasts before scoring
        working-directory: forecast-history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.json
          git diff --cached --quiet || git commit -m "Record hourly forecast attempt"
          git push origin HEAD:forecast-history
      - name: Score closed targets and publish health
        run: python -m alphaforge.live --ledger forecast-history/state.json --phase score
      - name: Persist outcomes and health history
        working-directory: forecast-history
        run: |
          git add state.json
          git diff --cached --quiet || git commit -m "Score completed forecast targets"
          git push origin HEAD:forecast-history
      - name: Preserve forecast evidence
        uses: actions/upload-artifact@v4
        with:
          name: hourly-forecast
          path: |
            docs/latest-forecasts.json
            docs/live-performance.json
          retention-days: 7
      - name: Flag data failures in run summary
        run: |
          python - <<'PYCODE'
          import json, os
          state = json.load(open('docs/live-performance.json'))
          attempt = state['last_attempt']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('## Forecast health\n\n' + json.dumps(attempt, indent=2) + '\n')
          if attempt['forecast'] != 'ok' or attempt['scoring'] != 'ok':
              print('::warning::Forecast or scoring data unavailable; see published health status.')
          PYCODE
      - name: Package current dashboard and fresh forecasts
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
