name: Hourly forecasts and Pages
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'models/hourly-v1/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/hourly.yml'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  forecast:
    if: github.repository == 'suheum-heo/alphaforge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU inference dependencies
        run: |
          python -m pip install 'torch==2.14.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[deep]'
      - name: Fetch closed candles and generate both forecasts
        run: python -m alphaforge.hourly
      - name: Preserve forecast evidence
        uses: actions/upload-artifact@v4
        with:
          name: hourly-forecast
          path: docs/latest-forecasts.json
          retention-days: 7
      - name: Package current dashboard and fresh forecasts
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deploy:
    needs: forecast
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
