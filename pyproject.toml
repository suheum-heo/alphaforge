[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaforge"
version = "0.1.0"
description = "Leakage-aware hourly crypto forecasting research pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["certifi>=2024.8.30", "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.5,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1,<2", "httpx>=0.28,<1"]
deep = ["torch>=2.5,<3"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1"]

[project.scripts]
alphaforge = "alphaforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.package-data]
alphaforge = ["web/*.html", "web/*.css", "web/*.js", "web/*.md"]
